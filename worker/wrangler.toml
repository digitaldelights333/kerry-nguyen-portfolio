name = "kerry-availability"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
# Comma-separated list of sites allowed to call this Worker.
ALLOWED_ORIGIN = "https://digitaldelights333.github.io"
CALENDAR_ID = "primary"
TIMEZONE = "America/Chicago"
WORK_START = "09:00"
WORK_END = "17:00"
WORK_DAYS = "1,2,3,4,5"      # Monday=1 ... Sunday=7
DAYS_AHEAD = "21"
MIN_NOTICE_HOURS = "24"
MIN_SLOT_MINUTES = "30"

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN
